[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medguard"
version = "0.1.0"
description = "MedGuard Engine — le coeur de confiance de Médicure AI (qualité, calibration, fiabilité, refus de conclure)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
model = ["torch>=2.0", "torchvision>=0.15", "torchxrayvision>=1.3"]
app = ["gradio>=5.0", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "matplotlib>=3.7", "tqdm>=4.65", "httpx>=0.27", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.0", "nbconvert>=7.0"]

[tool.setuptools.packages.find]
include = ["medguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
