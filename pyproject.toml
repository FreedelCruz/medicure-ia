[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medguard"
version = "0.1.0"
description = "MedGuard Engine — le coeur de confiance de Médicure AI (qualité, calibration, fiabilité, refus de conclure)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "pillow>=11.0",
    "opencv-python-headless>=4.11",
]

[project.optional-dependencies]
model = ["torch==2.5.1", "torchvision==0.20.1", "torchxrayvision>=1.5.5"]
app = ["gradio>=6.28", "fastapi>=0.115", "uvicorn>=0.32", "python-multipart>=0.0.9"]
dev = ["pytest>=8.3", "matplotlib>=3.9", "tqdm>=4.66", "httpx>=0.28", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "nbconvert>=7.16"]

[tool.setuptools.packages.find]
include = ["medguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
